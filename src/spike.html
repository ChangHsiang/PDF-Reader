<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>PDFium spike</title>
    <style>
      html, body { margin: 0; background: #525659; font: 13px system-ui, sans-serif; color: #eee; }
      #bar { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; gap: 8px; align-items: center;
             padding: 0 12px; background: #323639; z-index: 10; }
      #bar button { height: 26px; }
      #scroller { position: absolute; top: 36px; left: 0; right: 0; bottom: 0; overflow: auto; }
      #pages { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; }
      .pg { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
      .pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .pg .glyphs { position: absolute; inset: 0; pointer-events: none; }
      .pg .glyphs div { position: absolute; outline: 1px solid rgba(255, 0, 0, .55); }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="info">loading…</span>
      <button id="zout">−</button><span id="z">100%</span><button id="zin">+</button>
      <label><input type="checkbox" id="showGlyphs" /> 字形框</label>
    </div>
    <div id="scroller"><div id="pages"></div></div>
    <script type="module" src="./spike/main.js"></script>
  </body>
</html>
